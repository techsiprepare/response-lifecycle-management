<script>
    (function () {
        // 1. ESTILIZAÇÕES (CSS Externo Injetado)
        const styleId = 'style-modal-corrigir-precuradoria';
        if (!document.getElementById(styleId)) {
            const style = document.createElement('style');
            style.id = styleId;
            style.textContent = `
                #app-active-modal .app-modal-card { max-width: 420px; }
            `;
            document.head.appendChild(style);
        }

        // 2. ESTRUTURA TEMPLATE / HTML
        function getFormHTML() {
            return `
                <div class="app-modal-field-group">
                <label for="prova-id-select" class="app-modal-field-label">Selecione o ID da Prova:</label>
                <select id="prova-id-select" class="app-modal-input" disabled>
                    <option value="">Carregando IDs...</option>
                </select>
                <span id="err-prova-select" class="app-modal-error-text">Por favor, selecione um ID de prova válido.</span>
                </div>

                <div class="app-modal-field-group">
                <label for="questao-num-select" class="app-modal-field-label">Selecione a Questão:</label>
                <select id="questao-num-select" class="app-modal-input" disabled>
                    <option value="">Selecione primeiro uma prova...</option>
                </select>
                <span id="err-questao-select" class="app-modal-error-text">Por favor, selecione uma questão válida.</span>
                </div>
            `;
        }

        // 3. LÓGICAS EXCLUSIVAS DE INTERFACE (Abertura, Eventos e Integração UI)
        window.ModalServices = window.ModalServices || {};

        window.ModalServices.abrirModalCorrigirPreCuradoria = function (resposta) {
            if (!window.ModalServices.renderModalBase) {
                return console.error('FE-Component-Modals.html ausente.');
            }
            if (!resposta?.ticket) {
                return console.error('Parâmetro "resposta" é obrigatório e deve conter um ticket.');
            }

            const modalRef = window.ModalServices.renderModalBase({
                title: 'Corrigir Pré-Curadoria',
                bodyHtml: getFormHTML(),
                buttons: [
                    {
                        label: 'Cancelar',
                        variant: 'app-btn-light',
                        onClick: () => modalRef.fechar()
                    },
                    {
                        label: 'Salvar',
                        variant: 'app-btn-orange',
                        onClick: salvarAlteracoes
                    }
                ]
            });

            const provaSelect = document.getElementById('prova-id-select');
            const questaoSelect = document.getElementById('questao-num-select');
            const errProva = document.getElementById('err-prova-select');
            const errQuestao = document.getElementById('err-questao-select');

            function salvarAlteracoes() {
                if (!validarFormularios(provaSelect, questaoSelect, errProva, errQuestao)) return;

                const idSelecionado = provaSelect.value;
                const questaoSelecionada = questaoSelect.value;
                const provas = window._cacheListaProvas || [];

                const novosCampos = montarPayloadAtualizacao(provas, idSelecionado, questaoSelecionada);

                if (window.AppStore?.atualizarTicket) {
                    window.AppStore.atualizarTicket(resposta.ticket, novosCampos);
                }

                modalRef.fechar();
            }

            provaSelect?.addEventListener('change', (e) => {
                provaSelect.classList.remove('input-error');
                errProva?.classList.remove('visible');
                atualizarSelectQuestoes(questaoSelect, window._cacheListaProvas || [], e.target.value);
            });

            questaoSelect?.addEventListener('change', () => {
                questaoSelect.classList.remove('input-error');
                errQuestao?.classList.remove('visible');
            });

            carregarProvasBackend(provaSelect, questaoSelect, resposta);
        };

        // 4. LÓGICAS DE REGRA DE NEGÓCIO (Validações, Cache e Requisições)
        function validarFormularios(provaSelect, questaoSelect, errProva, errQuestao) {
            let valido = true;

            if (!provaSelect?.value) {
                provaSelect?.classList.add('input-error');
                errProva?.classList.add('visible');
                valido = false;
            } else {
                provaSelect?.classList.remove('input-error');
                errProva?.classList.remove('visible');
            }

            if (!questaoSelect?.value) {
                questaoSelect?.classList.add('input-error');
                errQuestao?.classList.add('visible');
                valido = false;
            } else {
                questaoSelect?.classList.remove('input-error');
                errQuestao?.classList.remove('visible');
            }

            return valido;
        }

        function montarPayloadAtualizacao(provas, idSelecionado, questaoSelecionada) {
            const provaObj = provas.find(p => String(p.idProva) === String(idSelecionado));
            const questaoObj = provaObj?.questoes?.find(q => String(q.questaoNum) === String(questaoSelecionada));

            const novosCampos = {
                idProva: idSelecionado,
                questaoNum: questaoSelecionada,
                preCuradoria: '✅ Válido (Prova e Questão existem)'
            };

            if (questaoObj?.tipo) {
                novosCampos.tipo = questaoObj.tipo;
            }

            return novosCampos;
        }

        function atualizarSelectQuestoes(questaoSelect, provas, idProvaSelecionado, questaoPreSelecionada = null) {
            if (!questaoSelect) return;

            if (!idProvaSelecionado) {
                questaoSelect.innerHTML = `<option value="">Selecione primeiro uma prova...</option>`;
                questaoSelect.disabled = true;
                return;
            }

            const provaObj = provas.find(p => String(p.idProva) === String(idProvaSelecionado));
            const questoes = Array.isArray(provaObj?.questoes) ? provaObj.questoes : [];

            if (questoes.length === 0) {
                questaoSelect.innerHTML = `<option value="">Nenhuma questão cadastrada nesta prova</option>`;
                questaoSelect.disabled = true;
                return;
            }

            const optionsHtml = questoes.map(q => {
                const bloqueada = q.bloquear === 'Bloqueado';
                const tipoLabel = q.tipo ? ` - ${q.tipo}` : '';
                const statusLabel = bloqueada ? ' (Bloqueada)' : '';
                return `<option value="${q.questaoNum}" ${bloqueada ? 'disabled' : ''}>Questão ${q.questaoNum}${tipoLabel}${statusLabel}</option>`;
            }).join('');

            questaoSelect.innerHTML = `<option value="">-- Selecione a Questão --</option>${optionsHtml}`;
            questaoSelect.disabled = false;

            if (questaoPreSelecionada && questoes.some(q => String(q.questaoNum) === String(questaoPreSelecionada))) {
                questaoSelect.value = questaoPreSelecionada;
            }
        }

        function carregarProvasBackend(provaSelect, questaoSelect, resposta) {
            if (typeof google !== 'undefined' && google.script?.run) {
                google.script.run
                    .withSuccessHandler((provas) => {
                        if (!provaSelect) return;

                        const listaProvas = Array.isArray(provas) ? provas : [];
                        window._cacheListaProvas = listaProvas;

                        if (listaProvas.length === 0) {
                            provaSelect.innerHTML = `<option value="">Nenhuma prova encontrada</option>`;
                            return;
                        }

                        provaSelect.innerHTML = `
                            <option value="">-- Selecione o ID --</option>
                            ${listaProvas.map(p => `<option value="${p.idProva}">${p.idProva}</option>`).join('')}
                        `;
                        provaSelect.disabled = false;

                        if (resposta.idProva && listaProvas.some(p => String(p.idProva) === String(resposta.idProva))) {
                            provaSelect.value = resposta.idProva;
                            atualizarSelectQuestoes(questaoSelect, listaProvas, resposta.idProva, resposta.questaoNum);
                        }
                    })
                    .withFailureHandler((err) => {
                        console.error('Erro ao buscar provas:', err);
                        if (provaSelect) provaSelect.innerHTML = `<option value="">Erro ao carregar IDs</option>`;
                    })
                    .obterProvas();
            } else {
                console.warn('google.script.run não disponível.');
            }
        }
    })();
</script>
