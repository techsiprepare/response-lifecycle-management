<!--
 =============================================================================
 COMPONENTE: RespostaDetailSection (Estratégias por Status com Modais e AppButton)
 =============================================================================
 RESPONSABILIDADE:
 Mapeia os status dos tickets para configurações de botões (rotulo, cor e ação).
 Transfere a renderização visual para o componente burro `AppButton` e
 delega regras de negócio interativas para modais ou serviços específicos.
 =============================================================================
-->

<script>
    (function () {
        // -------------------------------------------------------------------------
        // 1. ESTILOS ISOLADOS
        // -------------------------------------------------------------------------
        const styleId = 'style-resposta-detail-section';
        if (!document.getElementById(styleId)) {
            const style = document.createElement('style');
            style.id = styleId;
            style.textContent = `
        .status-section-container {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        .status-actions-group {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          margin-top: 8px;
        }

        .status-actions-group .info-label {
          font-size: 0.72rem;
          font-weight: 700;
          color: #8fa0b0;
          text-transform: uppercase;
          width: 100%;
          margin-bottom: 4px;
        }
      `;
            document.head.appendChild(style);
        }

        // -------------------------------------------------------------------------
        // 2. HELPER DE RENDERIZAÇÃO DE GRUPOS DE BOTÕES
        // -------------------------------------------------------------------------
        function renderButtonGroup(label, buttonConfigs) {
            if (!buttonConfigs || buttonConfigs.length === 0) return '';

            const buttonsHtml = buttonConfigs
                .map(config => window.AppButton.render({
                    label: config.label,
                    variant: config.variant,
                    onClickHandler: config.onClick
                }))
                .join('');

            return `
                <div class="status-actions-group">
                    <span class="info-label">${label}</span>
                    ${buttonsHtml}
                </div>
            `;
        }

        // -------------------------------------------------------------------------
        // 3. CONTRATO BASE DA ESTRATÉGIA DE SEÇÃO
        // -------------------------------------------------------------------------
        class StatusSectionStrategy {
            /**
             * Retorna as configurações de botões divididas por grupos/abas.
             * @param {Object} item - Objeto do ticket/resposta atual.
             * @returns {Object} { conteudoButtons, comunicacaoButtons, fluxoButtons }
             */
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [],
                    comunicacaoButtons: [],
                    fluxoButtons: []
                };
            }

            render(item) {
                const config = this.getButtonConfigurations(item);
                const conteudoHtml = renderButtonGroup('Conteúdo e Revisão', config.conteudoButtons);
                const comunicacaoHtml = renderButtonGroup('Comunicação', config.comunicacaoButtons);
                const fluxoHtml = renderButtonGroup('Fluxo de Trabalho', config.fluxoButtons);

                return `
                    <div class="status-section-container">
                        ${conteudoHtml}
                        ${comunicacaoHtml}
                        ${fluxoHtml}
                    </div>
                `;
            }
        }

        // -------------------------------------------------------------------------
        // 4. DICIONÁRIO DE CONFIGURAÇÕES DE BOTÕES REUTILIZÁVEIS
        // -------------------------------------------------------------------------
        const createBtnConfig = {
            verVideoAluno: (ticketId) => ({
                label: 'Ver Vídeo do Aluno',
                variant: 'app-btn-light',
                onClick: () => window.ModalServices.abrirModalVideo(ticketId)
            }),
            verQuestaoSite: (ticketId) => ({
                label: 'Ver Questão no Site',
                variant: 'app-btn-light',
                onClick: () => { } // redirecionamento direto a ser implementado
            }),
            abrirGmailBuscarTicket: (ticketId) => ({
                label: 'Abrir Gmail (Buscar Ticket)',
                variant: 'app-btn-light',
                onClick: () => { } // redirecionamento direto a ser implementado
            }),
            verAutorizacao: (ticketId) => ({
                label: 'Ver Autorização',
                variant: 'app-btn-light',
                onClick: () => window.ModalServices.abrirModalVerAutorizacao(ticketId)
            }),
            enviarBaremaAluno: (ticketId) => ({
                label: 'Enviar Barema para Aluno',
                variant: 'app-btn-light',
                onClick: () => window.ModalServices.abrirModalEnvioBarema(ticketId)
            }),
            solicitarAvaliacaoProfessor: (ticketId) => ({
                label: 'Solicitar Avaliação p/ Professor',
                variant: 'app-btn-light',
                onClick: () => window.ModalServices.abrirModalSolicitarAvaliacao(ticketId)
            }),
            salvarLinkVideo: (ticketId) => ({
                label: 'Salvar Link do Vídeo',
                variant: 'app-btn-light',
                onClick: () => window.ModalServices.abrirModalSalvarVideo(ticketId)
            }),
            aprovarTicket: (ticketId) => ({
                label: 'Aprovar Ticket',
                variant: 'app-btn-success',
                onClick: () => window.ModalServices.abrirModalMudarStatus(ticketId, 'Aprovado')
            }),
            devolverAjustes: (ticketId) => ({
                label: 'Devolver p/ Ajustes',
                variant: 'app-btn-light',
                onClick: () => window.ModalServices.abrirModalMudarStatus(ticketId, 'Devolvido para Ajustes')
            }),
            rejeitarTicket: (ticketId) => ({
                label: 'Rejeitar Ticket',
                variant: 'app-btn-danger',
                onClick: () => window.ModalServices.abrirModalMudarStatus(ticketId, 'Rejeitado')
            }),
            mudarProntoReanalise: (ticketId) => ({
                label: 'Mudar p/ Pronto p/ Reanálise',
                variant: 'app-btn-purple',
                onClick: () => window.ModalServices.abrirModalMudarStatus(ticketId, 'Pronto p/ Reanálise')
            }),
            mudarProntoParaAnalise: (ticketId) => ({
                label: 'Mudar p/ Pronto p/ Análise',
                variant: 'app-btn-blue',
                onClick: () => window.ModalServices.abrirModalMudarStatus(ticketId, 'Pronto p/ Análise')
            }),
            mudarEmAnalise: (ticketId) => ({
                label: 'Mudar p/ Em análise',
                variant: 'app-btn-orange',
                onClick: () => window.ModalServices.abrirModalMudarStatus(ticketId, 'Em análise')
            })
        };

        // -------------------------------------------------------------------------
        // 5. ESTRATÉGIAS CONCRETAS POR STATUS
        // -------------------------------------------------------------------------

        class NovoStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item.ticket),
                        createBtnConfig.verQuestaoSite(item.ticket)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarProntoParaAnalise(item.ticket)
                    ]
                };
            }
        }

        class ProntoParaAnaliseStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item.ticket),
                        createBtnConfig.verQuestaoSite(item.ticket)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item.ticket)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarEmAnalise(item.ticket)
                    ]
                };
            }
        }

        class EmAnaliseStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item.ticket),
                        createBtnConfig.verQuestaoSite(item.ticket),
                        createBtnConfig.verAutorizacao(item.ticket)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item.ticket),
                        createBtnConfig.enviarBaremaAluno(item.ticket),
                        createBtnConfig.solicitarAvaliacaoProfessor(item.ticket)
                    ],
                    fluxoButtons: [
                        createBtnConfig.aprovarTicket(item.ticket),
                        createBtnConfig.devolverAjustes(item.ticket),
                        createBtnConfig.rejeitarTicket(item.ticket),
                        createBtnConfig.mudarProntoReanalise(item.ticket)
                    ]
                };
            }
        }

        class ProntoParaReanaliseStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item.ticket),
                        createBtnConfig.verQuestaoSite(item.ticket)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item.ticket)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarEmAnalise(item.ticket)
                    ]
                };
            }
        }

        class DevolvidoStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item.ticket),
                        createBtnConfig.verQuestaoSite(item.ticket)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item.ticket)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarProntoReanalise(item.ticket)
                    ]
                };
            }
        }

        class AprovadoStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item.ticket),
                        createBtnConfig.verQuestaoSite(item.ticket),
                        createBtnConfig.salvarLinkVideo(item.ticket)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item.ticket)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarProntoReanalise(item.ticket)
                    ]
                };
            }
        }

        class RejeitadoStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item.ticket),
                        createBtnConfig.verQuestaoSite(item.ticket)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item.ticket)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarProntoReanalise(item.ticket)
                    ]
                };
            }
        }

        class DefaultStatusStrategy extends StatusSectionStrategy {
            render(item) {
                return `<div class="status-section-container"></div>`;
            }
        }

        // -------------------------------------------------------------------------
        // 6. REGISTRO ESTÁTICO DE ESTRATÉGIAS
        // -------------------------------------------------------------------------
        const STATUS_STRATEGIES = Object.freeze({
            'Novo': new NovoStatusStrategy(),
            'Em análise': new EmAnaliseStatusStrategy(),
            'Pronto p/ Análise': new ProntoParaAnaliseStatusStrategy(),
            'Pronto p/ Reanálise': new ProntoParaReanaliseStatusStrategy(),
            'Devolvido para ajustes': new DevolvidoStatusStrategy(),
            'Aprovado': new AprovadoStatusStrategy(),
            'Rejeitado': new RejeitadoStatusStrategy()
        });

        const defaultStrategy = new DefaultStatusStrategy();

        // -------------------------------------------------------------------------
        // 7. INTERFACE PÚBLICA (Contexto)
        // -------------------------------------------------------------------------
        window.RespostaDetailSection = {
            render: function (item) {
                if (!item || !item.status) return '';

                const strategy = STATUS_STRATEGIES[item.status] || defaultStrategy;
                return strategy.render(item);
            }
        };
    })();
</script>
