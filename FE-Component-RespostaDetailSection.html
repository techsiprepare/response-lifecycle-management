<!--
 =============================================================================
 COMPONENTE: RespostaDetailSection (Estratégias por Status)
 =============================================================================
 RESPONSABILIDADE:
 Renderiza dinamicamente o conteúdo específico e o grupo de botões de ação
 de acordo com o status atual do ticket.

 PADRÃO STRATEGY:
 Cada status mapeia para uma classe de estratégia concreta que sabe renderizar
 suas informações e ações específicas, utilizando um template base.
 =============================================================================
-->

<script>
    (function () {
        // -------------------------------------------------------------------------
        // 1. ESTILOS ISOLADOS (Substituição total de CSS Inline por Classes)
        // -------------------------------------------------------------------------
        const styleId = 'style-resposta-detail-section';
        if (!document.getElementById(styleId)) {
            const style = document.createElement('style');
            style.id = styleId;
            style.textContent = `
        .status-section-container {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        .status-section-title {
          font-size: 0.8rem;
          font-weight: 700;
          text-transform: uppercase;
          color: #4a5568;
          margin: 0;
        }

        .status-description {
          font-size: 0.85rem;
          color: #718096;
          margin: 0;
        }

        .status-actions-group {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          margin-top: 8px;
        }

        .status-field-group {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        .status-field-label {
          font-size: 0.72rem;
          font-weight: 700;
          color: #8fa0b0;
          text-transform: uppercase;
        }

        .status-field-value {
          font-size: 0.875rem;
          color: #2d3748;
          font-weight: 500;
        }

        .status-field-value-highlight {
          color: #c05621;
          font-weight: 600;
        }

        .status-textarea {
          width: 100%;
          min-height: 80px;
          border: 1px solid #cbd5e0;
          border-radius: 8px;
          padding: 10px 12px;
          font-family: inherit;
          font-size: 0.875rem;
          color: #2d3748;
          box-sizing: border-box;
          resize: vertical;
          outline: none;
          transition: border-color 0.2s ease;
        }

        .status-textarea:focus {
          border-color: #3182ce;
          box-shadow: 0 0 0 1px #3182ce;
        }
      `;
            document.head.appendChild(style);
        }

        // -------------------------------------------------------------------------
        // 2. FUNÇÃO GERADORA DE TEMPLATE (Helper)
        // -------------------------------------------------------------------------
        function renderSectionGroup(label, buttonsKeys, ticket) {
            if (!buttonsKeys || buttonsKeys.length === 0) return '';

            const buttonsHtml = buttonsKeys.map(key => window.Buttons.render(key, ticket)).join('');

            return `
                <div class="status-actions-group">
                    <span class="info-label">${label}</span>
                    ${buttonsHtml}
                </div>
            `;
        }

        function renderBaseTemplate(item, config) {
            const conteudoHtml = renderSectionGroup('Conteúdo e Revisão', config.conteudoButtons, item.ticket);
            const comunicacaoHtml = renderSectionGroup('Comunicação', config.comunicacaoButtons, item.ticket);
            const fluxoHtml = renderSectionGroup('Fluxo de Trabalho', config.fluxoButtons, item.ticket);

            return `
                <div class="status-section-container">
                    ${conteudoHtml}
                    ${comunicacaoHtml}
                    ${fluxoHtml}
                </div>
            `;
        }

        // -------------------------------------------------------------------------
        // 3. CONTRATO BASE DA ESTRATÉGIA DE SEÇÃO
        // -------------------------------------------------------------------------
        class StatusSectionStrategy {
            render(item) {
                throw new Error("O método render() deve ser implementado pela estratégia concreta.");
            }
        }

        // -------------------------------------------------------------------------
        // 4. ESTRATÉGIAS CONCRETAS POR STATUS (Uma para cada Status)
        // -------------------------------------------------------------------------

        class NovoStatusStrategy extends StatusSectionStrategy {
            render(item) {
                return renderBaseTemplate(item, {
                    conteudoButtons: ['ver_video_aluno', 'ver_questao_site'],
                    fluxoButtons: ['mudar_pronto_para_analise']
                });
            }
        }

        class ProntoParaAnaliseStatusStrategy extends StatusSectionStrategy {
            render(item) {
                return renderBaseTemplate(item, {
                    conteudoButtons: ['ver_video_aluno', 'ver_questao_site'],
                    comunicacaoButtons: ['abrir_gmail_buscar_ticket'],
                    fluxoButtons: ['mudar_em_analise']
                });
            }
        }

        class EmAnaliseStatusStrategy extends StatusSectionStrategy {
            render(item) {
                return renderBaseTemplate(item, {
                    conteudoButtons: ['ver_video_aluno', 'ver_questao_site', 'ver_autorizacao'],
                    comunicacaoButtons: ['abrir_gmail_buscar_ticket', 'enviar_barema_aluno', 'solicitar_avaliacao_professor'],
                    fluxoButtons: ['aprovar_ticket', 'devolver_ajustes', 'rejeitar_ticket', 'mudar_pronto_reanalise']
                });
            }
        }

        class ProntoParaReanaliseStatusStrategy extends StatusSectionStrategy {
            render(item) {
                return renderBaseTemplate(item, {
                    conteudoButtons: ['ver_video_aluno', 'ver_questao_site'],
                    comunicacaoButtons: ['abrir_gmail_buscar_ticket'],
                    fluxoButtons: ['mudar_em_analise']
                });
            }
        }

        class DevolvidoStatusStrategy extends StatusSectionStrategy {
            render(item) {
                return renderBaseTemplate(item, {
                    conteudoButtons: ['ver_video_aluno', 'ver_questao_site'],
                    comunicacaoButtons: ['abrir_gmail_buscar_ticket'],
                    fluxoButtons: ['mudar_pronto_reanalise']
                });
            }
        }

        class AprovadoStatusStrategy extends StatusSectionStrategy {
            render(item) {
                return renderBaseTemplate(item, {
                    conteudoButtons: ['ver_video_aluno', 'ver_questao_site', 'salvar_link_video'],
                    comunicacaoButtons: ['abrir_gmail_buscar_ticket'],
                    fluxoButtons: ['mudar_pronto_reanalise']
                });
            }
        }

        class RejeitadoStatusStrategy extends StatusSectionStrategy {
            render(item) {
                return renderBaseTemplate(item, {
                    conteudoButtons: ['ver_video_aluno', 'ver_questao_site'],
                    comunicacaoButtons: ['abrir_gmail_buscar_ticket'],
                    fluxoButtons: ['mudar_pronto_reanalise']
                });
            }
        }

        class DefaultStatusStrategy extends StatusSectionStrategy {
            render(item) {
                return `
          <div class="status-section-container">
          </div>
        `;
            }
        }

        // -------------------------------------------------------------------------
        // 5. REGISTRO ESTÁTICO DE ESTRATÉGIAS (Pré-configuradas e Imutáveis)
        // -------------------------------------------------------------------------
        const STATUS_STRATEGIES = Object.freeze({
            'Novo': new NovoStatusStrategy(),
            'Em análise': new EmAnaliseStatusStrategy(),
            'Pronto p/ Análise': new ProntoParaAnaliseStatusStrategy(),
            'Pronto p/ Reanálise': new ProntoParaReanaliseStatusStrategy(),
            'Devolvido para ajustes': new DevolvidoStatusStrategy(),
            'Aprovado': new AprovadoStatusStrategy(),
            'Rejeitado': new RejeitadoStatusStrategy()
        });

        const defaultStrategy = new DefaultStatusStrategy();

        // -------------------------------------------------------------------------
        // 6. INTERFACE PÚBLICA (Contexto)
        // -------------------------------------------------------------------------
        window.RespostaDetailSection = {
            render: function (item) {
                if (!item || !item.status) return '';

                const strategy = STATUS_STRATEGIES[item.status] || defaultStrategy;
                return strategy.render(item);
            }
        };
    })();
</script>
