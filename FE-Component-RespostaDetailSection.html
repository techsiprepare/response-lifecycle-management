<script>
    (function () {
        // 1. ESTILIZAÇÕES (CSS Externo Injetado)
        const styleId = 'style-resposta-detail-section';
        if (!document.getElementById(styleId)) {
            const style = document.createElement('style');
            style.id = styleId;
            style.textContent = `
                .status-section-container {
                  display: flex;
                  flex-direction: column;
                  gap: 16px;
                }

                  .status-actions-group {
                    display: flex;
                    gap: 8px;
                    flex-wrap: wrap;
                    margin-top: 8px;
                  }

                .status-actions-group .info-label {
                    font-size: 0.72rem;
                    font-weight: 700;
                    color: #8fa0b0;
                    text-transform: uppercase;
                    width: 100%;
                    margin-bottom: 4px;
                }
            `;
            document.head.appendChild(style);
        }

        // 2. ESTRUTURA TEMPLATE / HTML
        function getButtonGroupHTML(label, buttonConfigs) {
            if (!buttonConfigs || buttonConfigs.length === 0) return '';

            const buttonsHtml = buttonConfigs
                .map(config => window.AppButton.render({
                    label: config.label,
                    variant: config.variant,
                    onClickHandler: config.onClick
                }))
                .join('');

            return `
              <div class="status-actions-group">
                <span class="info-label">${label}</span>
                ${buttonsHtml}
              </div>
            `;
        }

        function getSectionContainerHTML(conteudoHtml, comunicacaoHtml, fluxoHtml) {
            return `
              <div class="status-section-container">
                  ${conteudoHtml}
                  ${comunicacaoHtml}
                  ${fluxoHtml}
              </div>
            `;
        }

        // 3. LÓGICAS EXCLUSIVAS DE INTERFACE (Renderização e Montagem Visual)
        window.RespostaDetailSection = {
            render: function (item) {
                if (!item || !item.status) return '';

                const strategy = obterEstrategiaStatus(item.status);
                const config = strategy.getButtonConfigurations(item);

                const conteudoHtml = getButtonGroupHTML('Conteúdo e Revisão', config.conteudoButtons);
                const comunicacaoHtml = getButtonGroupHTML('Comunicação', config.comunicacaoButtons);
                const fluxoHtml = getButtonGroupHTML('Fluxo de Trabalho', config.fluxoButtons);

                return getSectionContainerHTML(conteudoHtml, comunicacaoHtml, fluxoHtml);
            }
        };

        // 4. LÓGICAS DE REGRA DE NEGÓCIO (Dicionário de Ações e Estratégias)
        const createBtnConfig = {
            verVideoAluno: (item) => ({
                label: 'Ver Vídeo do Aluno',
                variant: 'app-btn-light',
                onClick: () => window.ModalServices.abrirModalVideo(item)
            }),
            verQuestaoSite: (item) => ({
                label: 'Ver Questão no Site',
                variant: 'app-btn-light',
                onClick: () => window.AppStore.verQuestaoSite(item)
            }),
            abrirGmailBuscarTicket: (item) => ({
                label: 'Abrir Gmail (Buscar Ticket)',
                variant: 'app-btn-light',
                onClick: () => window.AppStore.abrirGmailBuscarTicket(item.ticket)
            }),
            verAutorizacao: (item) => ({
                label: 'Ver Autorização',
                variant: 'app-btn-light',
                onClick: () => window.ModalServices.abrirModalVerAutorizacao(item)
            }),
            enviarBaremaAluno: (item) => ({
                label: 'Enviar Barema para Aluno',
                variant: 'app-btn-light',
                onClick: () => { } // TODO: implementar window.ModalServices.abrirModalEnvioBarema(item)
            }),
            solicitarAvaliacaoProfessor: (item) => ({
                label: 'Solicitar Avaliação p/ Professor',
                variant: 'app-btn-light',
                onClick: () => { } // TODO: implementar window.ModalServices.abrirModalSolicitarAvaliacao(item)
            }),
            salvarLinkVideo: (item) => ({
                label: 'Salvar Link do Vídeo',
                variant: 'app-btn-light',
                onClick: () => { } // TODO: implementar window.ModalServices.abrirModalSalvarVideo(item)
            }),
            aprovarTicket: (item) => ({
                label: 'Aprovar Ticket',
                variant: 'app-btn-success',
                onClick: () => window.ModalServices.abrirModalMudarStatus(item, 'Aprovado', 'app-btn-success')
            }),
            devolverAjustes: (item) => ({
                label: 'Devolver p/ Ajustes',
                variant: 'app-btn-yellow',
                onClick: () => window.ModalServices.abrirModalMudarStatus(item, 'Devolvido para ajustes', 'app-btn-yellow')
            }),
            rejeitarTicket: (item) => ({
                label: 'Rejeitar Ticket',
                variant: 'app-btn-danger',
                onClick: () => window.ModalServices.abrirModalMudarStatus(item, 'Rejeitado', 'app-btn-danger')
            }),
            mudarProntoReanalise: (item) => ({
                label: 'Mudar p/ Pronto p/ Reanálise',
                variant: 'app-btn-purple',
                onClick: () => window.ModalServices.abrirModalMudarStatus(item, 'Pronto p/ Reanálise', 'app-btn-purple')
            }),
            mudarProntoParaAnalise: (item) => ({
                label: 'Mudar p/ Pronto p/ Análise',
                variant: 'app-btn-blue',
                onClick: () => window.ModalServices.abrirModalMudarStatus(item, 'Pronto p/ Análise', 'app-btn-blue')
            }),
            mudarEmAnalise: (item) => ({
                label: 'Mudar p/ Em análise',
                variant: 'app-btn-orange',
                onClick: () => window.ModalServices.abrirModalMudarStatus(item, 'Em análise', 'app-btn-orange')
            }),
            corrigirPreCuradoria: (item) => ({
                label: 'Corrigir Pré-Curadoria',
                variant: 'app-btn-orange',
                onClick: () => window.ModalServices.abrirModalCorrigirPreCuradoria(item)
            })
        };

        class StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [],
                    comunicacaoButtons: [],
                    fluxoButtons: []
                };
            }
        }

        class NovoStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                const preCuradoriaOk = String(item.preCuradoria || '').includes('✅ Válido');
                const fluxoBtn = preCuradoriaOk
                    ? createBtnConfig.mudarProntoParaAnalise(item)
                    : createBtnConfig.corrigirPreCuradoria(item);

                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item),
                        createBtnConfig.verQuestaoSite(item)
                    ],
                    comunicacaoButtons: [],
                    fluxoButtons: [fluxoBtn]
                };
            }
        }

        class ProntoParaAnaliseStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item),
                        createBtnConfig.verQuestaoSite(item)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarEmAnalise(item)
                    ]
                };
            }
        }

        class EmAnaliseStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item),
                        createBtnConfig.verQuestaoSite(item),
                        createBtnConfig.verAutorizacao(item)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item),
                        createBtnConfig.enviarBaremaAluno(item),
                        createBtnConfig.solicitarAvaliacaoProfessor(item)
                    ],
                    fluxoButtons: [
                        createBtnConfig.aprovarTicket(item),
                        createBtnConfig.devolverAjustes(item),
                        createBtnConfig.rejeitarTicket(item),
                        createBtnConfig.mudarProntoReanalise(item)
                    ]
                };
            }
        }

        class ProntoParaReanaliseStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item),
                        createBtnConfig.verQuestaoSite(item)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarEmAnalise(item)
                    ]
                };
            }
        }

        class DevolvidoStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item),
                        createBtnConfig.verQuestaoSite(item)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarProntoReanalise(item)
                    ]
                };
            }
        }

        class AprovadoStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item),
                        createBtnConfig.verQuestaoSite(item),
                        createBtnConfig.salvarLinkVideo(item)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarProntoReanalise(item)
                    ]
                };
            }
        }

        class RejeitadoStatusStrategy extends StatusSectionStrategy {
            getButtonConfigurations(item) {
                return {
                    conteudoButtons: [
                        createBtnConfig.verVideoAluno(item),
                        createBtnConfig.verQuestaoSite(item)
                    ],
                    comunicacaoButtons: [
                        createBtnConfig.abrirGmailBuscarTicket(item)
                    ],
                    fluxoButtons: [
                        createBtnConfig.mudarProntoReanalise(item)
                    ]
                };
            }
        }

        const STATUS_STRATEGIES = Object.freeze({
            'Novo': new NovoStatusStrategy(),
            'Em análise': new EmAnaliseStatusStrategy(),
            'Pronto p/ Análise': new ProntoParaAnaliseStatusStrategy(),
            'Pronto p/ Reanálise': new ProntoParaReanaliseStatusStrategy(),
            'Devolvido para ajustes': new DevolvidoStatusStrategy(),
            'Aprovado': new AprovadoStatusStrategy(),
            'Rejeitado': new RejeitadoStatusStrategy()
        });

        const defaultStrategy = new StatusSectionStrategy();

        function obterEstrategiaStatus(status) {
            return STATUS_STRATEGIES[status] || defaultStrategy;
        }
    })();
</script>
