<script>
    (function () {
        // 1. ESTILIZAÇÕES (CSS Externo Injetado)
        const styleId = 'style-app-toast';
        if (!document.getElementById(styleId)) {
            const style = document.createElement('style');
            style.id = styleId;
            style.textContent = `
                #toast-container {
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    z-index: 9999;
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                }

                .app-toast-item {
                    color: #ffffff;
                    padding: 12px 20px;
                    border-radius: 6px;
                    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                    font-size: 14px;
                    opacity: 0;
                    transform: translateY(10px);
                    transition: opacity 0.3s ease, transform 0.3s ease;
                }

                .app-toast-item.visible {
                    opacity: 1;
                    transform: translateY(0);
                }
            `;
            document.head.appendChild(style);
        }

        window.FEComponenteToast = window.FEComponenteToast || {};

        // 2. ESTRUTURA TEMPLATE / HTML
        function getToastContainerHTML() {
            return `<div id="toast-container"></div>`;
        }

        function getToastItemHTML(texto) {
            return texto;
        }

        // 3. LÓGICAS EXCLUSIVAS DE INTERFACE (Gerenciamento de DOM e Animações)
        function obterOuCriarContainer() {
            let container = document.getElementById('toast-container');
            if (!container) {
                const tempContainer = document.createElement('div');
                tempContainer.innerHTML = getToastContainerHTML();
                container = tempContainer.firstElementChild;
                document.body.appendChild(container);
            }
            return container;
        }

        function animarECiclarToast(toastEl, cor, duracao) {
            toastEl.style.backgroundColor = cor;

            requestAnimationFrame(() => {
                toastEl.classList.add('visible');
            });

            setTimeout(() => {
                toastEl.classList.remove('visible');
                setTimeout(() => toastEl.remove(), 300);
            }, duracao);
        }

        window.FEComponenteToast = {
            exibir: function (opcoes) {
                const { texto, cor, duracao } = normalizarOpcoesToast(opcoes);

                const container = obterOuCriarContainer();
                const toastEl = document.createElement('div');
                toastEl.className = 'app-toast-item';
                toastEl.innerHTML = getToastItemHTML(texto);

                container.appendChild(toastEl);
                animarECiclarToast(toastEl, cor, duracao);
            }
        };

        // 4. LÓGICAS DE REGRA DE NEGÓCIO (Tratamento de Parâmetros e Fallbacks)
        function normalizarOpcoesToast(opcoes = {}) {
            return {
                texto: opcoes.texto || '',
                cor: opcoes.cor || '#323232',
                duracao: typeof opcoes.duracao === 'number' ? opcoes.duracao : 3000
            };
        }
    })();
</script>
