<script>
    window.ModalService = {

        // Garante que o overlay do modal existe no DOM e registra os eventos internos.
        // Idempotente: seguro chamar múltiplas vezes.
        init: function () {
            if (!document.getElementById('url-modal-overlay')) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = window.AppComponents.UrlModal();
                const overlay = tempDiv.firstElementChild;
                document.body.appendChild(overlay);

                document.getElementById('url-modal-close').addEventListener('click', () => this.fechar());
                overlay.addEventListener('click', (e) => { if (e.target === overlay) this.fechar(); });
            }
        },

        // Abre o modal preenchendo título, descrição e botões de ação.
        abrir: function (titulo, desc, btnsHtml) {
            this.init();
            document.getElementById('url-modal-title').textContent = titulo;
            document.getElementById('url-modal-desc').textContent = desc;
            document.getElementById('url-modal-btns').innerHTML = btnsHtml;
            document.getElementById('url-modal-resultado').style.display = 'none';
            document.getElementById('url-modal-close').style.display = 'inline-block';
            document.getElementById('url-modal-prof-container').style.display = 'none';
            document.getElementById('url-modal-overlay').style.display = 'flex';
        },

        // Fecha o modal ocultando o overlay.
        fechar: function () {
            const overlay = document.getElementById('url-modal-overlay');
            if (overlay) overlay.style.display = 'none';
        },

        // Exibe o resultado de uma operação (sucesso ou erro) dentro do modal.
        // dados: { sucesso: boolean, mensagem: string, ticket?: string }
        exibirResultado: function (dados) {
            document.getElementById('url-modal-btns').innerHTML = '';
            document.getElementById('url-modal-desc').textContent = '';
            document.getElementById('url-modal-prof-container').style.display = 'none';

            const msg = document.getElementById('url-modal-msg');
            msg.textContent = dados.mensagem || 'Operação concluída.';
            msg.style.color = dados.sucesso ? '#22543d' : '#9b2c2c';

            const gmailLink = document.getElementById('url-modal-gmail-link');
            if (dados.ticket) {
                gmailLink.href = 'https://mail.google.com/mail/#search/' + encodeURIComponent('in:drafts ' + dados.ticket);
            }

            const resultado = document.getElementById('url-modal-resultado');

            let alertBox = document.getElementById('url-modal-conclusao-alert');
            if (dados.sucesso) {
                if (!alertBox) {
                    alertBox = document.createElement('div');
                    alertBox.id = 'url-modal-conclusao-alert';
                    alertBox.className = 'modal-alert-box';
                }

                alertBox.innerHTML = '<strong>⚠️ Atenção:</strong> Para um aluno poder reenviar o link do vídeo, o Ticket deve obrigatoriamente ficar como "Devolvido p/ Ajustes", caso contrário o ticket ficará bloqueado! Atente-se para alterar o status para "Devolvido p/ Ajustes" ou "Aprovado" quando for necessário.';
                alertBox.style.display = 'block';

                // Insere o bloco de atenção ANTES do link do Gmail (ou como primeiro elemento do resultado)
                if (gmailLink) {
                    resultado.insertBefore(alertBox, gmailLink);
                } else {
                    resultado.prepend(alertBox);
                }
            } else if (alertBox) {
                alertBox.style.display = 'none';
            }

            resultado.style.display = 'flex';
            resultado.style.flexDirection = 'column';
        },

        // Abre um modal de confirmação para alteração de status (Aprovado ou Devolvido para ajustes)
        abrirConfirmacaoStatus: function (opcoes) {
            this.init();
            const alertBox = document.getElementById('url-modal-conclusao-alert');
            if (alertBox) alertBox.style.display = 'none';

            const gmailUrl = 'https://mail.google.com/mail/#search/' + encodeURIComponent(opcoes.ticket);

            const btnsHtml = `
                <div style="display:flex; flex-direction:column; gap:8px;">
                    <a href="${gmailUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="text-align:center;">
                        Confira os e-mails relacionados no Gmail
                    </a>
                    <button id="modal-btn-confirmar-status" class="btn ${opcoes.btnClass || 'btn-primary'}">
                        ${opcoes.textoConfirmar || 'Confirmar'}
                    </button>
                </div>
            `;

            this.abrir(opcoes.titulo, opcoes.mensagem, btnsHtml);

            const btnConfirmar = document.getElementById('modal-btn-confirmar-status');
            if (btnConfirmar && typeof opcoes.onConfirmar === 'function') {
                btnConfirmar.addEventListener('click', () => {
                    btnConfirmar.disabled = true;
                    btnConfirmar.textContent = 'Processando...';
                    opcoes.onConfirmar();
                });
            }
        },

        // Abre um modal de confirmação de rejeição com campo para preenchimento da coluna Motivo
        abrirConfirmacaoRejeicao: function (opcoes) {
            this.init();
            const alertBox = document.getElementById('url-modal-conclusao-alert');
            if (alertBox) alertBox.style.display = 'none';

            const btnsHtml = `
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <label style="font-size:0.75rem; font-weight:700; color:#8fa0b0; text-transform:uppercase;">Motivo da Rejeição *</label>
                        <textarea id="modal-input-motivo-rejeicao" class="select-custom" placeholder="Informe o motivo da rejeição..." style="width:100%; min-height:70px; resize:vertical; font-family:inherit; box-sizing:border-box;"></textarea>
                        <span id="modal-motivo-error" style="color:#e53e3e; font-size:0.75rem; display:none; margin-top:2px;">O motivo da rejeição é obrigatório.</span>
                    </div>
                    <button id="modal-btn-confirmar-rejeicao" class="btn btn-secondary" style="background-color:#e53e3e; color:#ffffff;">
                        ${opcoes.textoConfirmar || 'Confirmar Rejeição'}
                    </button>
                </div>
            `;

            this.abrir(opcoes.titulo || 'Rejeitar Ticket', opcoes.mensagem || 'Tem certeza que deseja rejeitar este ticket?', btnsHtml);

            const btnConfirmar = document.getElementById('modal-btn-confirmar-rejeicao');
            const inputMotivo = document.getElementById('modal-input-motivo-rejeicao');
            const errorMsg = document.getElementById('modal-motivo-error');

            if (inputMotivo) {
                inputMotivo.addEventListener('input', () => {
                    if (inputMotivo.value.trim().length > 0 && errorMsg) {
                        errorMsg.style.display = 'none';
                    }
                });
            }

            if (btnConfirmar && typeof opcoes.onConfirmar === 'function') {
                btnConfirmar.addEventListener('click', () => {
                    const motivo = inputMotivo ? inputMotivo.value.trim() : '';
                    if (!motivo) {
                        if (errorMsg) errorMsg.style.display = 'block';
                        return;
                    }
                    if (errorMsg) errorMsg.style.display = 'none';
                    btnConfirmar.disabled = true;
                    btnConfirmar.textContent = 'Processando...';
                    opcoes.onConfirmar(motivo);
                });
            }
        },

        // Abre modal de alerta para mudança de status de ticket devolvido para reanálise
        abrirAlertaReanaliseDevolvido: function (opcoes) {
            this.init();
            const alertBox = document.getElementById('url-modal-conclusao-alert');
            if (alertBox) alertBox.style.display = 'none';

            const btnsHtml = `
                <div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">
                    <div style="background-color:#fffaf0; border:1px solid #feebc8; border-radius:8px; padding:10px 12px; font-size:0.8rem; color:#7b341e; line-height:1.4;">
                        <strong>⚠️ Atenção:</strong> ${opcoes.mensagem}
                    </div>
                    <button id="modal-btn-confirmar-devolvido-alerta" class="btn btn-warning" style="margin-top:6px;">
                        ${opcoes.textoConfirmar || 'Confirmar Mudança'}
                    </button>
                </div>
            `;

            this.abrir(opcoes.titulo || 'Mudar p/ Pronto p/ Reanálise', '', btnsHtml);

            const btnConfirmar = document.getElementById('modal-btn-confirmar-devolvido-alerta');
            if (btnConfirmar && typeof opcoes.onConfirmar === 'function') {
                btnConfirmar.addEventListener('click', () => {
                    btnConfirmar.disabled = true;
                    btnConfirmar.textContent = 'Processando...';
                    opcoes.onConfirmar();
                });
            }
        },

        // Abre modal listando a fila de tickets anteriores para a mesma questão
        abrirFilaQuestaoModal: function (ticketAtual, fila) {
            this.init();
            const alertBox = document.getElementById('url-modal-conclusao-alert');
            if (alertBox) alertBox.style.display = 'none';

            const titulo = `Fila para a Questão (${ticketAtual.questaoNum ? 'Qst ' + ticketAtual.questaoNum : 'Mesma Questão'})`;
            const desc = `Histórico de tickets com a mesma prova e questão submetidos em datas anteriores a este ticket (${ticketAtual.ticket}):`;

            const cardsHtml = fila.map(item => {
                const badgeHtml = window.AppComponents.Badge(item.status);
                const temVideo = item.videoUrl && /^https?:\/\//i.test(item.videoUrl);

                return `
                    <div class="fila-card">
                        <div class="fila-card-header">
                            <div>
                                <strong>${item.ticket}</strong>
                                <span class="fila-card-date">🕒 ${item.dataHora}</span>
                            </div>
                            <div>${badgeHtml}</div>
                        </div>
                        <div class="fila-card-body">
                            <div><strong>Aluno:</strong> ${item.nomeAluno}</div>
                            <div><strong>Assunto:</strong> ${item.assunto || 'Não informado'}</div>
                            ${item.responsavel ? `<div><strong>Responsável:</strong> ${item.responsavel}</div>` : ''}
                            ${item.motivo ? `<div style="color:#c53030; margin-top:2px;"><strong>Motivo:</strong> ${item.motivo}</div>` : ''}
                        </div>
                        ${temVideo ? `
                            <div class="fila-card-footer">
                                <a href="${item.videoUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="font-size:0.75rem; padding:4px 8px;">
                                    🎬 Ver Vídeo
                                </a>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            const btnsHtml = `
                <div class="fila-container-scroll" style="max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; padding-right: 4px;">
                    ${cardsHtml}
                </div>
            `;

            const modalElem = document.getElementById('url-modal');
            if (modalElem) modalElem.style.maxWidth = '580px';

            this.abrir(titulo, desc, btnsHtml);
        }
    };
</script>
