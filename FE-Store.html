<script>
    // -------------------------------------------------------------------------
    // UTILITÁRIO: Geração de ID único de sessão
    // -------------------------------------------------------------------------
    function gerarSessionId() {
        return typeof crypto !== 'undefined' && crypto.randomUUID
            ? crypto.randomUUID()
            : 'session_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    }

    window.AppStore = {
        // -------------------------------------------------------------------------
        // STATE
        // -------------------------------------------------------------------------
        state: {
            respostas: [],
            loading: true,
            filtro: '',
            ticketSelecionado: null,
            sessionId: gerarSessionId(),
            ticketsEmProcessamento: []
        },
        listeners: [],

        // Timestamp de quando a store iniciou na sessão
        horaInicioSessao: Date.now(),

        // -------------------------------------------------------------------------
        // CORE: Inicialização (apenas fetch inicial — listener é responsabilidade
        // do FE-Service-FirebaseListener)
        // -------------------------------------------------------------------------
        async init() {
            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler((dados) => {
                        this.setState({
                            respostas: Array.isArray(dados) ? dados : [],
                            loading: false
                        });
                        resolve(dados);
                    })
                    .withFailureHandler((err) => {
                        this.setState({ loading: false });
                        reject(err);
                    })
                    .carregarDadosIniciais();
            });
        },

        // -------------------------------------------------------------------------
        // CORE: Leitura, escrita e notificação de estado
        // -------------------------------------------------------------------------
        getState() {
            return this.state;
        },

        setState(newState, salvarNoServidor = false, respostaParaSalvar = null) {
            this.state = { ...this.state, ...newState };
            this.notify();

            if (salvarNoServidor && respostaParaSalvar) {
                google.script.run
                    .withSuccessHandler(() => {
                        this.setState({ loading: false });
                    })
                    .withFailureHandler((err) => {
                        console.error('Erro ao salvar e notificar:', err);
                        this.setState({ loading: false });
                    })
                    .salvarRespostaENotificar(respostaParaSalvar, this.state.sessionId);
            }
        },

        subscribe(listener) {
            this.listeners.push(listener);
        },

        notify() {
            this.listeners.forEach((listener) => listener(this.state));
        },

        // -------------------------------------------------------------------------
        // HELPER INTERNO: Comparação de tickets normalizada
        // -------------------------------------------------------------------------
        _ticketsIguais(a, b) {
            return String(a) === String(b);
        },

        // -------------------------------------------------------------------------
        // ACTIONS PÚBLICAS: Ciclo de vida de tickets em processamento
        // -------------------------------------------------------------------------

        // Chamado pelo FirebaseListener quando status === 'processando'
        marcarTicketEmProcessamento(ticket) {
            const jaExiste = this.state.ticketsEmProcessamento.some((t) => this._ticketsIguais(t, ticket));
            if (jaExiste) return;

            this.setState({
                ticketsEmProcessamento: [...this.state.ticketsEmProcessamento, ticket]
            });
        },

        // Chamado pelo FirebaseListener quando status === 'sucesso' ou 'erro'
        concluirProcessamentoTicket(ticket) {
            this.setState({
                ticketsEmProcessamento: this.state.ticketsEmProcessamento.filter(
                    (t) => !this._ticketsIguais(t, ticket)
                )
            });
        },

        // -------------------------------------------------------------------------
        // ACTIONS PÚBLICAS: Atualização de ticket
        // -------------------------------------------------------------------------
        atualizarTicket(ticketId, novosCampos) {
            const resposta = this.state.respostas?.find(r => this._ticketsIguais(r.ticket, ticketId));

            if (!resposta) {
                console.error(`Ticket #${ticketId} não encontrado na store.`);
                return false;
            }

            const respostaAtualizada = { ...resposta, ...novosCampos };
            const novasRespostas = this.state.respostas.map(r =>
                this._ticketsIguais(r.ticket, ticketId) ? respostaAtualizada : r
            );

            this.setState({ respostas: novasRespostas, loading: true }, true, respostaAtualizada);
            return true;
        },

        // -------------------------------------------------------------------------
        // MÉTODO INTERNO: Busca registro atualizado no backend e aplica no state
        // -------------------------------------------------------------------------
        _fetchEAtualizarTicket(ticket) {
            if (!ticket) return;

            google.script.run
                .withSuccessHandler((dadosAtualizados) => {
                    if (!dadosAtualizados) return;

                    // Atualiza o item na lista (ou adiciona se for novo)
                    const existe = this.state.respostas.some((item) => this._ticketsIguais(item.ticket, ticket));
                    const respostasAtualizadas = existe
                        ? this.state.respostas.map((item) =>
                            this._ticketsIguais(item.ticket, ticket) ? dadosAtualizados : item
                        )
                        : [...this.state.respostas, dadosAtualizados];

                    // Mantém o ticketSelecionado sincronizado se for o mesmo ticket
                    const ticketSelecionado =
                        this.state.ticketSelecionado &&
                            this._ticketsIguais(this.state.ticketSelecionado.ticket, ticket)
                            ? dadosAtualizados
                            : this.state.ticketSelecionado;

                    // 1. Encerra o estado de processamento (remove overlay), atualiza a tela e notifica
                    this.concluirProcessamentoTicket(ticket);
                    this.setState({ respostas: respostasAtualizadas, ticketSelecionado });

                    // 2. Exibe o toast de confirmação após tudo ser aplicado
                    window.FEComponenteToast?.exibir({
                        texto: `O ticket "${ticket}" foi atualizado em tempo real.`,
                        cor: '#2E7D32'
                    });
                })
                .withFailureHandler((err) => {
                    console.error('Erro ao buscar dados do ticket atualizado:', err);
                })
                .obterRespostaPorTicket(ticket);
        }
    };
</script>
