<script>
    function gerarSessionId() {
        return typeof crypto !== 'undefined' && crypto.randomUUID
            ? crypto.randomUUID()
            : 'session_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    }

    window.AppStore = {
        state: {
            respostas: [],
            loading: true,
            filtro: '',
            ticketSelecionado: null,
            sessionId: gerarSessionId()
        },
        listeners: [],

        async init() {
            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler((dados) => {
                        this.setState({
                            respostas: Array.isArray(dados) ? dados : [],
                            loading: false
                        });
                        resolve(dados);
                    })
                    .withFailureHandler((err) => {
                        this.setState({ loading: false });
                        reject(err);
                    })
                    .carregarDadosIniciais();
            });
        },

        getState() {
            return this.state;
        },

        setState(newState, salvarNoServidor = false, respostaParaSalvar = null) {
            this.state = { ...this.state, ...newState };
            this.notify();

            if (salvarNoServidor && respostaParaSalvar) {
                google.script.run
                    .withSuccessHandler(() => {
                        this.setState({ loading: false });
                    })
                    .withFailureHandler((err) => {
                        console.error('Erro ao salvar e notificar:', err);
                        this.setState({ loading: false });
                    })
                    .salvarRespostaENotificar(respostaParaSalvar, this.state.sessionId);
            }
        },

        subscribe(listener) {
            this.listeners.push(listener);
        },

        notify() {
            this.listeners.forEach((listener) => listener(this.state));
        }
    };
</script>
