<script>
  (function () {
    // 1. ESTILIZAÇÕES (CSS Externo Injetado)
    const styleId = 'style-resposta-detail';
    if (!document.getElementById(styleId)) {
      const style = document.createElement('style');
      style.id = styleId;
      style.textContent = `
        /* Fundo escurecido fixo que sobrepõe tudo */
        .detail-backdrop {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: rgba(0, 0, 0, 0.4);
          backdrop-filter: blur(2px);
          z-index: 9999;
          display: flex;
          justify-content: flex-end;
          opacity: 1;
          visibility: visible;
          transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* Estado Oculto do Fundo */
        .detail-backdrop.hidden {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }

        /* Container do Aside (Painel Lateral) */
        .detail-aside {
          position: relative;
          width: 420px;
          max-width: 90vw;
          height: 100vh;
          background: #ffffff;
          box-shadow: -4px 0 24px rgba(0, 0, 0, 0.15);
          display: flex;
          flex-direction: column;
          box-sizing: border-box;
          transform: translateX(0);
          transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Animação: Esconde empurrando para fora da tela (direita) */
        .detail-backdrop.hidden .detail-aside {
          transform: translateX(100%);
        }

        /* Cabeçalho Fixo no topo do Aside */
        .detail-header {
          padding: 20px 24px;
          border-bottom: 1px solid #edf2f7;
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: #ffffff;
          flex-shrink: 0;
        }

        .detail-title-group { display: flex; flex-direction: row; gap: 4px; }
        .detail-ticket-badge { font-size: 0.8rem; font-weight: 700; color: #4e4e4e; background-color: #edf2f7; padding: 2px 8px; border-radius: 6px; width: fit-content; }
        .detail-close-btn { background: transparent; border: none; font-size: 1.25rem; color: #a0aec0; cursor: pointer; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s; }
        .detail-close-btn:hover { background-color: #edf2f7; color: #4a5568; }

        /* Corpo rolável (Scroll Interno) */
        .detail-body {
          flex: 1;
          overflow-y: auto;
          padding: 24px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }

        .detail-info-grid { display: flex; flex-direction: column; gap: 14px; }
        .info-group { display: flex; flex-direction: column; gap: 2px; }
        .info-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: #8fa0b0; }
        .info-value { font-size: 0.9rem; font-weight: 500; color: #2c3e50; word-break: break-word; }
        .detail-status-section { border-top: 1px dashed #e1e8ed; padding-top: 16px; margin-top: 8px; }

        /* Banner de alerta para tickets duplicados */
        .detail-duplicados-banner {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px 14px;
          background: #fffbeb;
          border: 1px solid #fde68a;
          border-radius: 8px;
          font-size: 0.82rem;
          color: #92400e;
          line-height: 1.4;
        }
        .detail-duplicados-banner-text {
          flex: 1;
          font-weight: 500;
        }
        .detail-duplicados-banner-btn {
          flex-shrink: 0;
          padding: 5px 12px;
          font-size: 0.78rem;
          font-weight: 700;
          color: #92400e;
          background: #fef3c7;
          border: 1px solid #fde68a;
          border-radius: 6px;
          cursor: pointer;
          transition: background 0.2s ease;
          white-space: nowrap;
        }
        .detail-duplicados-banner-btn:hover {
          background: #fde68a;
        }

        /* Overlay de bloqueio - exibido quando outro usuário está editando o ticket */
        .detail-processing-overlay {
          position: absolute;
          inset: 0;
          background: rgba(255, 255, 255, 0.82);
          backdrop-filter: blur(4px);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          z-index: 10;
          border-radius: inherit;
          animation: overlayFadeIn 0.25s ease;
        }
        @keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }
        .detail-processing-icon { font-size: 2rem; animation: spin 1.2s linear infinite; }
        .detail-processing-text {
          font-size: 0.9rem;
          font-weight: 600;
          color: #2c3e50;
          text-align: center;
          max-width: 260px;
          line-height: 1.5;
        }
        .detail-processing-sub {
          font-size: 0.78rem;
          color: #8fa0b0;
        }
      `;
      document.head.appendChild(style);
    }

    // 2. ESTRUTURA TEMPLATE / HTML
    function getDetailHTML(item, respostas) {
      if (!item) return '';

      const questao = item.questaoNum ? `Questão ${item.questaoNum}` : '-';
      const tipoQuestao = item.tipo ? item.tipo : 'Tipo não informado.';
      const prova = item.idProva || '-';
      const dataHora = item.dataHora || item.dataCriacao || '-';
      const assunto = item.assuntoPrincipal || 'Assunto não informado.';
      const preCuradoria = item.preCuradoria || 'Pré-curadoria inexistente.';
      const motivo = item.motivo || 'Sem observações...';
      const responsavel = item.responsavel || 'Não atribuído';
      const nomeAluno = item.nomeCompleto || 'Aluno não informado';
      const videoOficial = item.urlVideoOficial
        ? `<a href="${item.urlVideoOficial}" target="_blank" rel="noopener noreferrer" style="color: #2563eb; text-decoration: underline; word-break: break-all;">${item.urlVideoOficial}</a>`
        : 'Não publicado no canal do YouTube do projeto.';

      const btnFecharHtml = window.AppButton.render({
        label: '✕',
        variant: 'app-btn-close',
        title: 'Fechar (ESC)',
        onClickHandler: () => window.RespostaDetail.fechar()
      });

      return `
        <aside class="detail-aside" onclick="event.stopPropagation()">
          <div class="detail-header">
            <div class="detail-title-group">
              <span class="detail-ticket-badge">${item.ticket}</span>
            </div>
            ${btnFecharHtml}
          </div>

          <div class="detail-body">
            ${getDuplicadosBannerHTML(item, respostas)}
            <div class="detail-info-grid">
              <div class="info-group">
                <span class="info-label">Status</span>
                <span class="info-value">${item.status}</span>
              </div>

              <div class="info-group">
                <span class="info-label">Aluno</span>
                <span class="info-value">${nomeAluno}</span>
              </div>

              <div class="info-group">
                <span class="info-label">Questão</span>
                <span class="info-value">${questao} - ${tipoQuestao}</span>
              </div>

              <div class="info-group">
                <span class="info-label">Prova</span>
                <span class="info-value">${prova}</span>
              </div>

              <div class="info-group">
                <span class="info-label">Responsável</span>
                <span class="info-value">${responsavel}</span>
              </div>

              <div class="info-group">
                <span class="info-label">Data e Hora</span>
                <span class="info-value">${dataHora}</span>
              </div>

              <div class="info-group">
                <span class="info-label">Assunto</span>
                <span class="info-value">${assunto}</span>
              </div>

              <div class="info-group">
                <span class="info-label">Pré-Curadoria</span>
                <span class="info-value">${preCuradoria}</span>
              </div>
              
              <div class="info-group">
                <span class="info-label">Vídeo Oficial</span>
                <span class="info-value">${videoOficial}</span>
              </div>     
              
              <div class="info-group">
                <span class="info-label">Observações</span>
                <span class="info-value">${motivo}</span>
              </div>                               
            </div>

            <div class="detail-status-section" id="detail-tab-content">
              ${window.RespostaDetailSection.render(item)}
            </div>
          </div>
        </aside>
      `;
    }

    function getProcessingOverlayHTML() {
      return `
        <div class="detail-processing-overlay">
          <span class="detail-processing-icon">⏳</span>
          <span class="detail-processing-text">Alguém está alterando esse ticket no momento</span>
          <span class="detail-processing-sub">O painel será atualizado automaticamente.</span>
        </div>
      `;
    }

    // 3. LÓGICAS EXCLUSIVAS DE INTERFACE (Overlay, Eventos e Reatividade)
    window.RespostaDetail = function () {
      const backdrop = document.createElement('div');
      backdrop.className = 'detail-backdrop hidden';

      backdrop.onclick = function () {
        window.RespostaDetail.fechar();
      };

      function render(state) {
        const ticketSelecionado = state?.ticketSelecionado;
        const respostas = state?.respostas || [];
        const emProcessamento = verificarProcessamentoTicket(ticketSelecionado, state?.ticketsEmProcessamento);

        if (!ticketSelecionado) {
          backdrop.classList.add('hidden');
          setTimeout(() => {
            if (backdrop.classList.contains('hidden')) backdrop.innerHTML = '';
          }, 300);
          return;
        }

        const item = buscarRespostaPorTicket(respostas, ticketSelecionado);

        if (!item) {
          backdrop.classList.add('hidden');
          return;
        }

        backdrop.innerHTML = getDetailHTML(item, respostas);

        if (emProcessamento) {
          const aside = backdrop.querySelector('.detail-aside');
          aside.insertAdjacentHTML('afterbegin', getProcessingOverlayHTML());
        }

        requestAnimationFrame(() => {
          backdrop.classList.remove('hidden');
        });
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && window.AppStore.getState().ticketSelecionado) {
          window.RespostaDetail.fechar();
        }
      });

      window.AppStore.subscribe(render);
      render(window.AppStore.getState());

      return backdrop;
    };

    window.RespostaDetail.fechar = function () {
      window.AppStore.setState({ ticketSelecionado: null });
    };

    // 4. LÓGICAS DE REGRA DE NEGÓCIO (Processamento de Dados e Buscas)
    function verificarProcessamentoTicket(ticketSelecionado, ticketsEmProcessamento = []) {
      if (!ticketSelecionado) return false;
      return ticketsEmProcessamento.some(
        (t) => String(t) === String(ticketSelecionado)
      );
    }

    function buscarRespostaPorTicket(respostas = [], ticketSelecionado) {
      return respostas.find(r => r.ticket === ticketSelecionado);
    }

    function buscarTicketsDuplicados(itemAtual, respostas = []) {
      if (!itemAtual?.questaoNum || !itemAtual?.tipo || !itemAtual?.idProva) return [];

      const dataAtual = parseDateString(itemAtual.dataHora || itemAtual.dataCriacao);

      return respostas
        .filter(r => {
          if (r.ticket === itemAtual.ticket) return false;
          if (String(r.questaoNum) !== String(itemAtual.questaoNum)) return false;
          if (String(r.tipo) !== String(itemAtual.tipo)) return false;
          if (String(r.idProva) !== String(itemAtual.idProva)) return false;

          if (dataAtual) {
            const dataOutro = parseDateString(r.dataHora || r.dataCriacao);
            if (dataOutro && dataOutro >= dataAtual) return false;
          }

          return true;
        })
        .sort((a, b) => {
          const dA = parseDateString(a.dataHora || a.dataCriacao);
          const dB = parseDateString(b.dataHora || b.dataCriacao);
          if (!dA || !dB) return 0;
          return dA - dB;
        });
    }

    function parseDateString(str) {
      if (!str) return null;
      // Formato pt-BR: "dd/mm/yyyy HH:MM:SS" ou "dd/mm/yyyy, HH:MM:SS"
      const match = String(str).match(/^(\d{2})\/(\d{2})\/(\d{4})[,\s]+(\d{2}):(\d{2}):(\d{2})$/);
      if (match) {
        return new Date(+match[3], +match[2] - 1, +match[1], +match[4], +match[5], +match[6]);
      }
      const parsed = new Date(str);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    function getDuplicadosBannerHTML(item, respostas) {
      if (!item?.questaoNum || !item?.tipo || !item?.idProva) return '';

      const duplicatas = buscarTicketsDuplicados(item, respostas);

      if (duplicatas.length === 0) {
        return `
          <div class="detail-duplicados-banner" style="background: #f0fdf4; border-color: #bbf7d0; color: #166534;">
            <span class="detail-duplicados-banner-text">
              Esse é o primeiro ticket para essa questão/prova.
            </span>
          </div>
        `;
      }

      const handlerId = 'dup_banner_' + Math.random().toString(36).substring(2, 11);
      window[handlerId] = function () {
        if (window.ModalServices?.abrirModalTicketsDuplicados) {
          window.ModalServices.abrirModalTicketsDuplicados(duplicatas);
        }
      };

      const plural = duplicatas.length === 1 ? '' : 's';
      return `
        <div class="detail-duplicados-banner">
          <span class="detail-duplicados-banner-text">
            Existe${plural === 's' ? 'm' : ''} <strong>${duplicatas.length}</strong> ticket${plural} anterior${plural === 's' ? 'es' : ''} com a mesma questão e prova.
          </span>
          <button type="button" class="detail-duplicados-banner-btn" onclick="window['${handlerId}']()">Ver ticket${plural}</button>
        </div>
      `;
    }
  })();
</script>
