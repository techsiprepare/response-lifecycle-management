<script>
  (function () {
    // 1. ESTILIZAÇÕES (CSS Externo Injetado)
    const styleId = 'style-resposta-item';
    if (!document.getElementById(styleId)) {
      const style = document.createElement('style');
      style.id = styleId;
      style.textContent = `
        .ticket-row { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; padding: 12px; transition: background-color 0.2s ease; cursor: pointer; border-radius: 8px; }
        .ticket-row:hover, .ticket-row.selected { background-color: #f0f4f8; }
        .ticket-row.hidden { display: none; }
        .cell { font-size: 0.85em; color: #2c3e50; font-weight: 500; }
        .cell-prova { width: 100%; }
        .cell-responsible { padding-left: 20px; border-left: 1px dashed #d1dce5; }
        .cell-status-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        
        /* Classe Base do Badge */
        .badge { display: inline-block; padding: 4px 10px; font-size: 0.75em; font-weight: 700; text-transform: uppercase; border-radius: 100px; white-space: nowrap; }

        /* Cores Específicas por Status */
        .badge-default { background-color: #edf2f7; color: #4a5568; }
        .badge-novo { background-color: #ebf8ff; color: #2b6cb0; }
        .badge-em-analise { background-color: #feebc8; color: #c05621; }
        .badge-pronto-analise { background-color: #ebf8ff; color: #3182ce; }
        .badge-pronto-reanalise { background-color: #e9d8fd; color: #6b46c1; }
        .badge-devolvido { background-color: #feefc3; color: #b7791f; }
        .badge-aprovado { background-color: #c6f6d5; color: #22543d; }
        .badge-rejeitado { background-color: #fed7d7; color: #9b2c2c; }
        .badge-nao-publicado { background-color: #feebc8; color: #c05621; }
      `;
      document.head.appendChild(style);
    }

    // 2. ESTRUTURA TEMPLATE / HTML
    window.RespostaItem = function (resposta) {
      const statusText = resposta.status || 'Pendente';
      const statusClass = getStatusClass(resposta.status);
      const provaQuestao = formatarProvaQuestao(resposta.idProva, resposta.questaoNum);

      return `
        <div class="ticket-row" id="item-${resposta.ticket}" onclick="window.RespostaItem.handleClick('${resposta.ticket}')">
          <div class="cell cell-status-group">
            <span class="badge ${statusClass}">${statusText}</span>
          </div>
          <span class="cell"><strong>${resposta.ticket || '-'}</strong></span>
          <span class="cell">${resposta.nomeCompleto || '-'}</span>
          <span class="cell cell-prova">${provaQuestao}</span>
          <div class="cell cell-responsible">
            ${resposta.responsavel || '-'}
          </div>
        </div>
      `;
    };

    // 3. LÓGICAS EXCLUSIVAS DE INTERFACE (Handlers de Eventos de UI)
    window.RespostaItem.handleClick = function (ticket) {
      window.AppStore.setState({ ticketSelecionado: ticket });
    };

    // 4. LÓGICAS DE REGRA DE NEGÓCIO (Mapeamentos e Formatação de Dados)
    const STATUS_CLASS_MAP = Object.freeze({
      'Novo': 'badge-novo',
      'Em análise': 'badge-em-analise',
      'Pronto p/ Análise': 'badge-pronto-analise',
      'Pronto p/ Reanálise': 'badge-pronto-reanalise',
      'Devolvido para ajustes': 'badge-devolvido',
      'Aprovado': 'badge-aprovado',
      'Rejeitado': 'badge-rejeitado',
      'Não Publicado': 'badge-nao-publicado'
    });

    function getStatusClass(status) {
      return STATUS_CLASS_MAP[status] || 'badge-default';
    }

    function formatarProvaQuestao(idProva, questaoNum) {
      return [idProva, questaoNum ? `Q${questaoNum}` : '']
        .filter(Boolean)
        .join(' - ') || '-';
    }
  })();
</script>
