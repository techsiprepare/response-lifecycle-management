<script>
    (function () {
        const Config = window.AppConfig;
        const Components = window.AppComponents;
        const Data = window.AppData;

        let searchDebounceTimeout = null;

        function performGlobalSearch(queryStr) {
            const query = (queryStr || '').trim().toLowerCase();
            if (!query) {
                Data.state.isSearchActive = false;
                Data.state.searchMatches = null;
                renderApp(false);
                return;
            }

            Data.state.isSearchActive = true;

            const searchInput = document.getElementById('search-ticket-input');
            const focusPos = searchInput ? searchInput.selectionStart : null;

            Data.fetchAllTickets((allTickets) => {
                const matches = allTickets.filter(t => {
                    const content = `${t.ticket} ${t.nomeAluno} ${t.idProva} ${t.questaoNum} ${t.assunto} ${t.responsavel} ${t.status}`.toLowerCase();
                    return content.includes(query);
                });

                Data.state.searchMatches = matches;

                const container = document.getElementById('app');
                container.innerHTML = Components.AppLayout(matches, Config, Data.state.activeTab, false, queryStr);
                bindEvents();

                const newSearchInput = document.getElementById('search-ticket-input');
                if (newSearchInput) {
                    newSearchInput.focus();
                    if (focusPos !== null) {
                        newSearchInput.setSelectionRange(focusPos, focusPos);
                    }
                }
            }, (err) => {
                console.error('Erro na busca global:', err);
            });
        }

        function renderApp(isLoading = false) {
            const container = document.getElementById('app');
            const currentSearch = Data.state.searchQuery || '';
            const ticketsToRender = Data.state.isSearchActive && Data.state.searchMatches
                ? Data.state.searchMatches
                : Data.state.tickets;

            container.innerHTML = Components.AppLayout(ticketsToRender, Config, Data.state.activeTab, isLoading, currentSearch);
            bindEvents();
        }

        function loadTabData(tabName) {
            Data.state.activeTab = tabName;
            Data.state.tickets = [];
            Data.state.selectedTicket = null;
            Data.state.searchQuery = '';
            Data.state.isSearchActive = false;
            Data.state.searchMatches = null;

            renderApp(true);

            Data.fetchTickets(() => renderApp(false), (err) => alert('Erro ao carregar aba: ' + err.message));
        }

        function bindEvents() {
            const aside = document.getElementById('ticket-aside');
            const closeBtn = document.getElementById('close-aside-btn');
            const ticketRows = document.querySelectorAll('.ticket-row');
            const tabs = document.querySelectorAll('.tab-item');
            const searchInput = document.getElementById('search-ticket-input');

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const val = e.target.value;
                    Data.state.searchQuery = val;
                    clearTimeout(searchDebounceTimeout);
                    searchDebounceTimeout = setTimeout(() => {
                        performGlobalSearch(val);
                    }, 200);
                });
            }

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const targetTab = tab.getAttribute('data-tab');
                    if (targetTab !== Data.state.activeTab || Data.state.isSearchActive) {
                        loadTabData(targetTab);
                    }
                });
            });

            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    aside.classList.remove('open');
                    ticketRows.forEach(r => r.classList.remove('selected'));
                });
            }

            ticketRows.forEach(row => {
                row.addEventListener('click', () => {
                    const ticketId = row.getAttribute('data-id');
                    const ticketList = Data.state.isSearchActive && Data.state.searchMatches
                        ? Data.state.searchMatches
                        : Data.state.tickets;

                    let ticket = ticketList.find(t => t.ticket === ticketId);
                    if (!ticket && Data.state.allTicketsCache) {
                        ticket = Data.state.allTicketsCache.find(t => t.ticket === ticketId);
                    }

                    if (ticket) {
                        Data.state.selectedTicket = ticket;
                        ticketRows.forEach(r => r.classList.remove('selected'));
                        row.classList.add('selected');

                        document.getElementById('aside-title-text').textContent =
                            `${Config.ui.asidePrefixTitle} ${ticket.ticket}`;

                        const asideBody = document.getElementById('aside-body-content');
                        asideBody.innerHTML = Components.AsideContent(ticket, Data.state.activeTab);

                        bindAsideActions(ticket);
                        aside.classList.add('open');
                    }
                });
            });
        }

        function bindAsideActions(ticket) {
            // Busca sob demanda se existem tickets anteriores para a mesma questão
            const containerFila = document.getElementById('container-fila-questao');
            if (containerFila) {
                containerFila.innerHTML = `
                    <div style="font-size: 0.78rem; color: #718096; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 10px; display: flex; align-items: center; gap: 8px;">
                        <span class="spinner" style="width: 13px; height: 13px; border-width: 2px; margin: 0;"></span>
                        <span>Procurando outras respostas para essa questão...</span>
                    </div>
                `;

                Data.fetchFilaMesmaQuestao(ticket, (fila) => {
                    if (fila && fila.length > 0) {
                        containerFila.innerHTML = `
                            <button id="btn-ver-fila-questao" class="btn btn-secondary" style="background-color: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; width: 100%; font-weight: 600; margin-bottom: 8px;">
                                Ver fila para essa questão (${fila.length})
                            </button>
                        `;
                        const btnFila = document.getElementById('btn-ver-fila-questao');
                        if (btnFila) {
                            btnFila.addEventListener('click', () => {
                                ModalService.abrirFilaQuestaoModal(ticket, fila);
                            });
                        }
                    } else {
                        containerFila.innerHTML = `
                            <div style="font-size: 0.78rem; color: #4a5568; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 10px; text-align: center; margin-bottom: 8px;">
                                Essa é a primeira tentativa de resposta para essa questão.
                            </div>
                        `;
                    }
                }, (err) => {
                    console.warn('Erro ao buscar fila para a mesma questão:', err);
                    containerFila.innerHTML = `
                        <div style="font-size: 0.78rem; color: #4a5568; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 10px; text-align: center; margin-bottom: 8px;">
                            Essa é a primeira tentativa de resposta para essa questão.
                        </div>
                    `;
                });
            }

            const btnFetchProvas = document.getElementById('btn-fetch-provas');
            const selectIdProva = document.getElementById('select-id-prova');
            const btnSaveProva = document.getElementById('btn-save-prova');
            const btnProntoAnalise = document.getElementById('btn-pronto-analise');

            const btnEmAnalise = document.getElementById('btn-em-analise');
            const btnRejeitado = document.getElementById('btn-rejeitado');

            // Botões da aba Em análise
            const btnAprovarTicket = document.getElementById('btn-aprovar-ticket');
            const btnDevolverAjustes = document.getElementById('btn-devolver-ajustes');
            const btnProntoReanalise = document.getElementById('btn-pronto-reanalise');
            const btnEnviarBaremaAluno = document.getElementById('btn-enviar-barema-aluno');
            const btnSolicitarProfessor = document.getElementById('btn-solicitar-professor');

            // Novos botões para abas Aprovados e Devolvido p/ Ajustes
            const btnSalvarUrlOficial = document.getElementById('btn-salvar-url-oficial');
            const inputUrlOficial = document.getElementById('input-url-oficial');
            const btnDevolvidoReanalise = document.getElementById('btn-devolvido-reanalise');

            if (btnFetchProvas) {
                btnFetchProvas.addEventListener('click', () => {
                    btnFetchProvas.textContent = "Carregando...";
                    btnFetchProvas.disabled = true;

                    Data.fetchProvasIds(
                        (ids) => {
                            btnFetchProvas.style.display = 'none';
                            selectIdProva.innerHTML = '<option value="">-- Selecione uma Prova --</option>' +
                                ids.map(id => `<option value="${id}" ${id === ticket.idProva ? 'selected' : ''}>${id}</option>`).join('');
                            selectIdProva.style.display = 'block';
                            btnSaveProva.style.display = 'block';
                        },
                        (err) => {
                            alert('Erro ao buscar IDs: ' + err.message);
                            btnFetchProvas.textContent = "Buscar IDs da Prova";
                            btnFetchProvas.disabled = false;
                        }
                    );
                });
            }

            if (btnSaveProva) {
                btnSaveProva.addEventListener('click', () => {
                    const novoId = selectIdProva.value;
                    if (!novoId) return alert('Selecione um ID de prova válido.');

                    btnSaveProva.textContent = "Salvando...";
                    btnSaveProva.disabled = true;

                    Data.salvarIdProva(ticket, novoId,
                        (msg) => {
                            renderApp();
                        },
                        (err) => {
                            alert('Erro ao salvar: ' + err.message);
                            btnSaveProva.disabled = false;
                            btnSaveProva.textContent = "Salvar Novo ID";
                        }
                    );
                });
            }

            if (btnProntoAnalise) {
                btnProntoAnalise.addEventListener('click', () => {
                    btnProntoAnalise.textContent = "Atualizando...";
                    btnProntoAnalise.disabled = true;

                    Data.concluirTriagem(ticket,
                        (msg) => {
                            document.getElementById('ticket-aside').classList.remove('open');
                            renderApp();
                        },
                        (err) => {
                            alert('Erro ao atualizar: ' + err.message);
                            btnProntoAnalise.disabled = false;
                        }
                    );
                });
            }

            const inputResponsavel = document.getElementById('input-responsavel');
            const msgAvisoResponsavel = document.getElementById('msg-aviso-responsavel');

            if (inputResponsavel && msgAvisoResponsavel) {
                const valorInicial = (ticket.responsavel || '').trim();
                inputResponsavel.addEventListener('input', () => {
                    const valorAtual = inputResponsavel.value.trim();
                    if (valorAtual !== valorInicial) {
                        msgAvisoResponsavel.style.display = 'block';
                    } else {
                        msgAvisoResponsavel.style.display = 'none';
                    }
                });
            }

            const executarAtualizacao = (novoStatus, btn) => {
                const responsavel = inputResponsavel ? inputResponsavel.value.trim() : (ticket.responsavel || '').trim();

                if (novoStatus === 'Em análise' && !responsavel) {
                    if (msgAvisoResponsavel) {
                        msgAvisoResponsavel.textContent = '⚠️ É obrigatório preencher o responsável antes de mudar para Em análise.';
                        msgAvisoResponsavel.style.display = 'block';
                    }
                    if (inputResponsavel) inputResponsavel.focus();
                    return;
                }

                if (btn) btn.disabled = true;

                Data.salvarAnalise(ticket, novoStatus, responsavel,
                    (msg) => {
                        document.getElementById('ticket-aside').classList.remove('open');
                        renderApp();
                    },
                    (err) => {
                        alert('Erro ao salvar: ' + err.message);
                        if (btn) btn.disabled = false;
                    }
                );
            };

            if (btnEmAnalise) {
                btnEmAnalise.addEventListener('click', () => executarAtualizacao('Em análise', btnEmAnalise));
            }

            if (btnRejeitado) {
                btnRejeitado.addEventListener('click', () => {
                    ModalService.abrirConfirmacaoRejeicao({
                        titulo: 'Rejeitar Ticket',
                        mensagem: `Confirme a rejeição do ticket ${ticket.ticket} e informe a justificativa:`,
                        textoConfirmar: 'Confirmar Rejeição',
                        onConfirmar: (motivo) => {
                            Data.salvarAnalise(ticket, 'Rejeitado', ticket.responsavel, motivo,
                                (msg) => {
                                    ModalService.fechar();
                                    document.getElementById('ticket-aside').classList.remove('open');
                                    renderApp();
                                },
                                (err) => {
                                    ModalService.exibirResultado({
                                        sucesso: false,
                                        mensagem: '❌ Erro ao rejeitar: ' + err.message,
                                        ticket: ticket.ticket
                                    });
                                }
                            );
                        }
                    });
                });
            }

            // ---- Ações da aba Em análise ----

            if (btnAprovarTicket) {
                btnAprovarTicket.addEventListener('click', () => {
                    ModalService.abrirConfirmacaoStatus({
                        titulo: 'Concluir Aprovação',
                        mensagem: 'Tem certeza de que quer aprovar? O e-mail avisando a aprovação para o aluno foi enviado corretamente? Confira os e-mails relacionados clicando no botão:',
                        ticket: ticket.ticket,
                        textoConfirmar: 'Confirmar Aprovação',
                        btnClass: 'btn-success',
                        onConfirmar: () => {
                            Data.salvarAnalise(ticket, 'Aprovado', ticket.responsavel,
                                (msg) => {
                                    ModalService.fechar();
                                    document.getElementById('ticket-aside').classList.remove('open');
                                    renderApp();
                                },
                                (err) => {
                                    ModalService.exibirResultado({
                                        sucesso: false,
                                        mensagem: '❌ Erro ao aprovar: ' + err.message,
                                        ticket: ticket.ticket
                                    });
                                }
                            );
                        }
                    });
                });
            }

            if (btnDevolverAjustes) {
                btnDevolverAjustes.addEventListener('click', () => {
                    ModalService.abrirConfirmacaoStatus({
                        titulo: 'Concluir Devolução p/ Ajustes',
                        mensagem: 'Atenção, o barema avisando a devolução para ajustes foi enviado corretamente para o aluno? Confira os e-mails relacionados clicando no botão:',
                        ticket: ticket.ticket,
                        textoConfirmar: 'Confirmar Devolução',
                        btnClass: 'btn-warning',
                        onConfirmar: () => {
                            Data.salvarAnalise(ticket, 'Devolvido para ajustes', ticket.responsavel,
                                (msg) => {
                                    ModalService.fechar();
                                    document.getElementById('ticket-aside').classList.remove('open');
                                    renderApp();
                                },
                                (err) => {
                                    ModalService.exibirResultado({
                                        sucesso: false,
                                        mensagem: '❌ Erro ao devolver para ajustes: ' + err.message,
                                        ticket: ticket.ticket
                                    });
                                }
                            );
                        }
                    });
                });
            }

            if (btnProntoReanalise) {
                btnProntoReanalise.addEventListener('click', () => {
                    btnProntoReanalise.textContent = 'Atualizando...';
                    btnProntoReanalise.disabled = true;

                    Data.salvarAnalise(ticket, 'Pronto p/ Reanálise', ticket.responsavel,
                        (msg) => {
                            document.getElementById('ticket-aside').classList.remove('open');
                            renderApp();
                        },
                        (err) => {
                            alert('Erro ao atualizar: ' + err.message);
                            btnProntoReanalise.disabled = false;
                            btnProntoReanalise.textContent = 'Mudar p/ Pronto p/ Reanálise';
                        }
                    );
                });
            }

            if (btnSalvarUrlOficial && inputUrlOficial) {
                btnSalvarUrlOficial.addEventListener('click', () => {
                    const novaUrl = inputUrlOficial.value.trim();
                    btnSalvarUrlOficial.textContent = 'Salvando...';
                    btnSalvarUrlOficial.disabled = true;

                    Data.salvarUrlVideoOficial(ticket, novaUrl,
                        (msg) => {
                            alert(msg || 'URL do Vídeo Oficial salva com sucesso!');
                            btnSalvarUrlOficial.textContent = 'Salvar Link do Vídeo';
                            btnSalvarUrlOficial.disabled = false;
                            renderApp();
                        },
                        (err) => {
                            alert('Erro ao salvar URL: ' + err.message);
                            btnSalvarUrlOficial.textContent = 'Salvar Link do Vídeo';
                            btnSalvarUrlOficial.disabled = false;
                        }
                    );
                });
            }

            if (btnDevolvidoReanalise) {
                btnDevolvidoReanalise.addEventListener('click', () => {
                    ModalService.abrirAlertaReanaliseDevolvido({
                        titulo: 'Mudar p/ Pronto p/ Reanálise',
                        mensagem: 'Se mudar o status do ticket, o aluno não conseguirá reenviar o link do vídeo pelo formulário de reenvio.',
                        textoConfirmar: 'Mudar Status Assim Mesmo',
                        onConfirmar: () => {
                            Data.salvarAnalise(ticket, 'Pronto p/ Reanálise', ticket.responsavel,
                                (msg) => {
                                    ModalService.fechar();
                                    document.getElementById('ticket-aside').classList.remove('open');
                                    renderApp();
                                },
                                (err) => {
                                    alert('Erro ao atualizar status: ' + err.message);
                                }
                            );
                        }
                    });
                });
            }

            function iniciarFluxoEmail(modo) {
                const titulo = modo === 'ALUNO'
                    ? 'Enviar Barema para Aluno'
                    : 'Solicitar Avaliação p/ Professor';

                ModalService.abrir(titulo, 'Verificando URLs disponíveis...', '<p style="color:#666; font-size:0.9em;">Aguarde...</p>');

                Data.obterUrlsTicket(ticket.rowIndex,
                    (urlData) => {
                        const btnsHtml = `
                            <button id="modal-btn-atualizada" class="btn btn-primary"
                                ${!urlData.temUrlAtualizada ? 'disabled style="opacity:0.4;"' : ''}>
                                Usar URL Atualizada ${!urlData.temUrlAtualizada ? '(Indisponível)' : ''}
                            </button>
                            <button id="modal-btn-original" class="btn btn-secondary"
                                ${!urlData.temUrlOriginal ? 'disabled style="opacity:0.4;"' : ''}>
                                Usar URL Original ${!urlData.temUrlOriginal ? '(Indisponível)' : ''}
                            </button>
                        `;

                        document.getElementById('url-modal-desc').textContent = 'Escolha qual link deseja utilizar no e-mail:';
                        document.getElementById('url-modal-btns').innerHTML = btnsHtml;

                        const btnAtt = document.getElementById('modal-btn-atualizada');
                        const btnOrig = document.getElementById('modal-btn-original');

                        // Configuração do Input de E-mail do Professor no Modal
                        if (modo === 'PROFESSOR') {
                            const profContainer = document.getElementById('url-modal-prof-container');
                            const inputProf = document.getElementById('modal-input-email-professor');
                            const errorMsg = document.getElementById('modal-email-error');

                            profContainer.style.display = 'flex';

                            // Preenche o valor padrão se o responsável contiver e-mail válido
                            const emailInicial = (ticket.responsavel && ticket.responsavel.includes('@')) ? ticket.responsavel.trim() : '';
                            inputProf.value = emailInicial;

                            // Validação imediata do e-mail do professor
                            const validarEmailProf = () => {
                                const val = inputProf.value.trim();
                                const isValid = val.length > 0 && val.includes('@') && val.includes('.');

                                if (!isValid) {
                                    errorMsg.style.display = 'block';
                                    if (btnAtt) { btnAtt.disabled = true; btnAtt.style.opacity = '0.4'; }
                                    if (btnOrig) { btnOrig.disabled = true; btnOrig.style.opacity = '0.4'; }
                                } else {
                                    errorMsg.style.display = 'none';
                                    if (btnAtt && urlData.temUrlAtualizada) { btnAtt.disabled = false; btnAtt.style.opacity = '1'; }
                                    if (btnOrig && urlData.temUrlOriginal) { btnOrig.disabled = false; btnOrig.style.opacity = '1'; }
                                }
                            };

                            // Roda a validação ao carregar e nos inputs
                            validarEmailProf();
                            inputProf.oninput = validarEmailProf;
                        }

                        const enviarEmail = (tipoEscolha) => {
                            let emailProfessor = '';
                            if (modo === 'PROFESSOR') {
                                emailProfessor = document.getElementById('modal-input-email-professor').value.trim();
                            }

                            document.getElementById('url-modal-prof-container').style.display = 'none';
                            document.getElementById('url-modal-btns').innerHTML = '<p style="color:#666;">Gerando rascunho no Gmail...</p>';
                            document.getElementById('url-modal-desc').textContent = '';

                            Data.gerarRascunhoEmail(ticket.rowIndex, modo, emailProfessor, tipoEscolha,
                                (res) => {
                                    ModalService.exibirResultado({
                                        sucesso: true,
                                        mensagem: '✅ ' + (res.mensagem || 'Rascunho criado com sucesso!'),
                                        ticket: res.ticket
                                    });
                                },
                                (err) => {
                                    ModalService.exibirResultado({
                                        sucesso: false,
                                        mensagem: '❌ ' + err.message,
                                        ticket: ticket.ticket
                                    });
                                }
                            );
                        };

                        if (btnAtt) btnAtt.addEventListener('click', () => { if (!btnAtt.disabled) enviarEmail('ATUALIZADA'); });
                        if (btnOrig) btnOrig.addEventListener('click', () => { if (!btnOrig.disabled) enviarEmail('ORIGINAL'); });
                    },
                    (err) => {
                        ModalService.exibirResultado({
                            sucesso: false,
                            mensagem: '❌ Erro ao verificar URLs: ' + err.message,
                            ticket: ticket.ticket
                        });
                    }
                );
            }

            if (btnEnviarBaremaAluno) {
                btnEnviarBaremaAluno.addEventListener('click', () => iniciarFluxoEmail('ALUNO'));
            }

            if (btnSolicitarProfessor) {
                btnSolicitarProfessor.addEventListener('click', () => iniciarFluxoEmail('PROFESSOR'));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            Data.fetchTickets(() => renderApp(), (err) => alert('Erro inicial: ' + err.message));
        });
    })();
</script>
