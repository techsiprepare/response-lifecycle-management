<script>
    (function () {
        // 1. ESTILIZAÇÕES (CSS Externo Injetado)
        const styleId = 'style-app-button';
        if (!document.getElementById(styleId)) {
            const style = document.createElement('style');
            style.id = styleId;
            style.textContent = `
                .app-btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s ease; gap: 6px; white-space: nowrap; width: 100%; }
                .app-btn:disabled { opacity: 0.6; cursor: not-allowed; }
                .app-btn-light { background-color: #f1f5f9; color: #475569; }
                .app-btn-light:hover:not(:disabled) { background-color: #e2e8f0; }
                .app-btn-success { background-color: #d1fae5; color: #065f46; }
                .app-btn-success:hover:not(:disabled) { background-color: #a7f3d0; }
                .app-btn-danger { background-color: #fee2e2; color: #991b1b; }
                .app-btn-danger:hover:not(:disabled) { background-color: #fecaca; }
                .app-btn-purple { background-color: #ede9fe; color: #5b21b6; }
                .app-btn-purple:hover:not(:disabled) { background-color: #ddd6fe; }
                .app-btn-blue { background-color: #e0f2fe; color: #0369a1; }
                .app-btn-blue:hover:not(:disabled) { background-color: #bae6fd; }
                .app-btn-orange { background-color: #ffedd5; color: #9a3412; }
                .app-btn-orange:hover:not(:disabled) { background-color: #fed7aa; }
                .app-btn-yellow { background-color: #fef9c3; color: #854d0e; }
                .app-btn-yellow:hover:not(:disabled) { background-color: #fef08a; }
                .app-btn-close { background: transparent; color: #a0aec0; border-radius: 50%; width: 32px; height: 32px; padding: 0; font-size: 1.25rem; }
                .app-btn-close:hover:not(:disabled) { background-color: #edf2f7; color: #4a5568; }
            `;
            document.head.appendChild(style);
        }

        // 2. ESTRUTURA TEMPLATE / HTML
        function getButtonHTML(label, variant, handlerId, title = '') {
            const titleAttr = title ? `title="${title}"` : '';
            return `
                <button type="button" class="app-btn ${variant}" ${titleAttr} onclick="window['${handlerId}'](event)">${label}</button>
            `;
        }

        // 3. LÓGICAS EXCLUSIVAS DE INTERFACE (Renderização e Registros de Handlers)
        window.AppButton = {
            render({ label, variant = 'app-btn-light', onClickHandler, title = '' }) {
                const handlerId = gerarHandlerUnico();
                registrarHandlerClique(handlerId, onClickHandler);

                return getButtonHTML(label, variant, handlerId, title);
            }
        };

        // 4. LÓGICAS DE REGRA DE NEGÓCIO (Geração de IDs e Callbacks Globais)
        function gerarHandlerUnico() {
            return 'btn_click_' + Math.random().toString(36).substring(2, 11);
        }

        function registrarHandlerClique(handlerId, onClickHandler) {
            window[handlerId] = function (event) {
                if (typeof onClickHandler === 'function') {
                    onClickHandler(event);
                }
            };
        }
    })();
</script>
