<script>
    // Utilitário: Gera ID único de sessão
    function gerarSessionId() {
        return typeof crypto !== 'undefined' && crypto.randomUUID
            ? crypto.randomUUID()
            : 'session_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    }

    window.AppStore = {
        // --- 1. ESTADO E PROPRIEDADES ---
        state: {
            respostas: [],
            loading: true,
            filtro: 'Novo',
            ticketSelecionado: null,
            sessionId: gerarSessionId(),
            ticketsEmProcessamento: [],
            formReenvioUrl: ''
        },
        listeners: [],
        horaInicioSessao: Date.now(),

        // --- 2. CICLO DE VIDA E REATIVIDADE ---
        async init() {
            await this.obterUrlFormReenvio();
            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler((dados) => {
                        this.setState({
                            respostas: Array.isArray(dados) ? dados : [],
                            loading: false
                        });
                        resolve(dados);
                    })
                    .withFailureHandler((err) => {
                        this.setState({ loading: false });
                        reject(err);
                    })
                    .carregarDadosIniciais();
            });
        },

        getState() {
            return this.state;
        },

        setState(newState, salvarNoServidor = false, respostaParaSalvar = null) {
            this.state = { ...this.state, ...newState };
            this.notify();

            if (salvarNoServidor && respostaParaSalvar) {
                google.script.run
                    .withSuccessHandler(() => {
                        this.setState({ loading: false });
                    })
                    .withFailureHandler((err) => {
                        console.error('Erro ao salvar e notificar:', err);
                        this.setState({ loading: false });
                    })
                    .salvarRespostaENotificar(respostaParaSalvar, this.state.sessionId);
            }
        },

        subscribe(listener) {
            this.listeners.push(listener);
        },

        notify() {
            this.listeners.forEach((listener) => listener(this.state));
        },

        // --- 3. GESTÃO DE TICKETS ---
        atualizarTicket(ticketId, novosCampos) {
            const resposta = this.state.respostas?.find(r => this._ticketsIguais(r.ticket, ticketId));

            if (!resposta) {
                console.error('Ticket #' + ticketId + ' não encontrado na store.');
                return false;
            }

            const respostaAtualizada = { ...resposta, ...novosCampos };
            const novasRespostas = this.state.respostas.map(r =>
                this._ticketsIguais(r.ticket, ticketId) ? respostaAtualizada : r
            );

            this.setState({ respostas: novasRespostas, loading: true }, true, respostaAtualizada);
            return true;
        },

        marcarTicketEmProcessamento(ticket) {
            const jaExiste = this.state.ticketsEmProcessamento.some((t) => this._ticketsIguais(t, ticket));
            if (jaExiste) return;

            this.setState({
                ticketsEmProcessamento: [...this.state.ticketsEmProcessamento, ticket]
            });
        },

        concluirProcessamentoTicket(ticket) {
            this.setState({
                ticketsEmProcessamento: this.state.ticketsEmProcessamento.filter(
                    (t) => !this._ticketsIguais(t, ticket)
                )
            });
        },

        // --- 4. INTEGRAÇÃO E LINKS EXTERNOS ---
        verQuestaoSite(item) {
            var url = item && item.verQuestaoSite;
            if (url) {
                window.open(url, '_blank');
            } else {
                if (window.FEComponenteToast && typeof window.FEComponenteToast.exibir === 'function') {
                    window.FEComponenteToast.exibir({
                        texto: 'Link da questão não disponível para este item.',
                        cor: '#d32f2f',
                        duracao: 3000
                    });
                } else {
                    window.alert('Link da questão não disponível para este item.');
                }
            }
        },

        abrirGmailBuscarTicket(ticket) {
            var query = encodeURIComponent('"' + ticket + '"');
            var url = 'https://mail.google.com/mail/u/0/#search/' + query;
            window.open(url, '_blank');
        },

        abrirEmailNoRascunho(ticket) {
            var safeTicket = (ticket || '').trim();
            var query = safeTicket ? encodeURIComponent('in:drafts "' + safeTicket + '"') : '';
            var url = safeTicket
                ? 'https://mail.google.com/mail/u/0/#search/' + query
                : 'https://mail.google.com/mail/u/0/#drafts';
            window.open(url, '_blank');
        },

        async obterUrlFormReenvio() {
            if (this.state.formReenvioUrl) {
                return this.state.formReenvioUrl;
            }
            return new Promise((resolve) => {
                if (typeof google !== 'undefined' && google.script?.run) {
                    google.script.run
                        .withSuccessHandler((url) => {
                            const link = url || '';
                            this.setState({ formReenvioUrl: link });
                            resolve(link);
                        })
                        .withFailureHandler((err) => {
                            console.warn('Erro ao obter link do formulário de reenvio:', err);
                            resolve('');
                        })
                        .obterUrlFormReenvio();
                } else {
                    resolve('');
                }
            });
        },

        async verificarRascunhoExistente(ticket) {
            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler((rascunho) => resolve(rascunho))
                    .withFailureHandler((err) => reject(err))
                    .verificarRascunhoExistente(ticket);
            });
        },

        async criarRascunhoEmail(dados) {
            this.setState({ loading: true });

            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler((rascunho) => {
                        this.setState({ loading: false });
                        window.FEComponenteToast?.exibir({
                            texto: 'Rascunho criado no Gmail com sucesso!',
                            cor: '#2E7D32'
                        });
                        resolve(rascunho);
                    })
                    .withFailureHandler((err) => {
                        this.setState({ loading: false });
                        window.FEComponenteToast?.exibir({
                            texto: 'Erro ao criar rascunho: ' + (err.message || err),
                            cor: '#C62828'
                        });
                        reject(err);
                    })
                    .criarRascunhoEmail(dados);
            });
        },

        // --- 5. MÉTODOS INTERNOS E HELPERS ---
        _ticketsIguais(a, b) {
            return String(a) === String(b);
        },

        _fetchEAtualizarTicket(ticket) {
            if (!ticket) return;

            google.script.run
                .withSuccessHandler((dadosAtualizados) => {
                    if (!dadosAtualizados) return;

                    const existe = this.state.respostas.some((item) => this._ticketsIguais(item.ticket, ticket));
                    const respostasAtualizadas = existe
                        ? this.state.respostas.map((item) =>
                            this._ticketsIguais(item.ticket, ticket) ? dadosAtualizados : item
                        )
                        : [...this.state.respostas, dadosAtualizados];

                    const ticketSelecionado =
                        this.state.ticketSelecionado &&
                            this._ticketsIguais(this.state.ticketSelecionado.ticket, ticket)
                            ? dadosAtualizados
                            : this.state.ticketSelecionado;

                    this.concluirProcessamentoTicket(ticket);
                    this.setState({ respostas: respostasAtualizadas, ticketSelecionado });

                    window.FEComponenteToast?.exibir({
                        texto: 'O ticket "' + ticket + '" foi atualizado em tempo real.',
                        cor: '#2E7D32'
                    });
                })
                .withFailureHandler((err) => {
                    console.error('Erro ao buscar dados do ticket atualizado:', err);
                })
                .obterRespostaPorTicket(ticket);
        }
    };
</script>
