      mudarProntoParaAnalise(ticketId) {
        if (!window.AppStore) {
          console.error('AppStore não encontrado.');
          return;
        }

        const estadoAtual = window.AppStore.getState();
        const respostaOriginal = estadoAtual.respostas?.find(
          r => String(r.ticket) === String(ticketId)
        );

        if (!respostaOriginal) {
          console.error(`Resposta com ticket #${ticketId} não encontrada no AppStore.`);
          return;
        }

        const respostaAtualizada = {
          ...respostaOriginal,
          status: 'Pronto p/ Análise'
        };

        const novasRespostas = estadoAtual.respostas.map(r =>
          String(r.ticket) === String(ticketId) ? respostaAtualizada : r
        );

        window.AppStore.setState(
          { respostas: novasRespostas, loading: true },
          true,
          respostaAtualizada
        );
      },
